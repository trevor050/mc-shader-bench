# Held-item ids (heldItemId / heldItemId2) for the colour of handheld light (lib/lighting.glsl heldLightColor).
# Colours match what the placed block casts through the light field.

# Fire: torches, lanterns, campfires, jack o'lanterns, lava bucket, blaze items.
item.1=minecraft:torch minecraft:lantern minecraft:campfire minecraft:jack_o_lantern minecraft:lava_bucket \
 minecraft:blaze_rod minecraft:fire_charge minecraft:magma_block minecraft:copper_torch minecraft:copper_lantern

# Soul fire.
item.2=minecraft:soul_torch minecraft:soul_lantern minecraft:soul_campfire

# Redstone.
item.3=minecraft:redstone_torch minecraft:redstone_lamp minecraft:redstone_block

# Warm yellow light blocks.
item.4=minecraft:glowstone minecraft:glowstone_dust minecraft:shroomlight minecraft:ochre_froglight \
 minecraft:glow_berries

# Cool aqua light blocks.
item.5=minecraft:sea_lantern minecraft:beacon minecraft:conduit minecraft:glow_ink_sac minecraft:glow_lichen \
 minecraft:prismarine_crystals

# Pale white-pink.
item.6=minecraft:end_rod minecraft:pearlescent_froglight

# Green.
item.7=minecraft:verdant_froglight minecraft:sea_pickle

# Violet.
item.8=minecraft:crying_obsidian minecraft:amethyst_cluster minecraft:amethyst_shard minecraft:end_crystal
