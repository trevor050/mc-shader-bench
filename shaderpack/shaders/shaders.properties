screen.COLOR=SATURATION GRADE_CONTRAST GRADE_VIBRANCE DUSK_VIBRANCE <empty> <empty> [EXPOSURE] [BLOOM]
screen.EXPOSURE=EXPOSURE_KEY DUSK_EXPOSURE EXPOSURE_MAX_CAVE EXPOSURE_KEY_OTHERWORLD
screen.BLOOM=BLOOM_STRENGTH GLARE_STRENGTH EMITTER_BLOOM EMITTER_BLOOM_THRESHOLD LOW_SUN_GLARE SUN_VEIL SUN_RAYS_STRENGTH <empty>
