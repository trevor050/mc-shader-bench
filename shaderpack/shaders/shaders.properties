screen.CLOUD_APPEARANCE=SKY_PRESET CLOUD_COVERAGE CLOUD_SPEED CLOUD_INSIDE_FOG CLOUD_MOON_SILVER CLOUD_IRIDESCENCE CLOUD_DUSK_SKYLIGHT <empty>
