# ClaudeBench shaderpack
# Performance profiles alter rendering budgets; artistic and comfort settings stay independent.
# Ultra matches the source defaults. Iris shows Custom after manual changes to profile-owned settings.
profile.ULTRA=PERFORMANCE_PROFILE=4 SHADOW_MAP_RES=3072 SHADOW_DIST=192.0 SHADOW_SAMPLES=12 SSR_STEPS=24 VL_STEPS=20 NETHER_SMOG_STEPS=12 TAA LIGHT_FIELD VOLUMETRIC_LIGHT WATER_SSR CLOUDS
profile.HIGH=PERFORMANCE_PROFILE=3 SHADOW_MAP_RES=2048 SHADOW_DIST=160.0 SHADOW_SAMPLES=8 SSR_STEPS=18 VL_STEPS=14 NETHER_SMOG_STEPS=9 TAA LIGHT_FIELD VOLUMETRIC_LIGHT WATER_SSR CLOUDS
profile.MEDIUM=PERFORMANCE_PROFILE=2 SHADOW_MAP_RES=2048 SHADOW_DIST=128.0 SHADOW_SAMPLES=6 SSR_STEPS=12 VL_STEPS=10 NETHER_SMOG_STEPS=6 TAA LIGHT_FIELD VOLUMETRIC_LIGHT WATER_SSR CLOUDS
profile.LOW=PERFORMANCE_PROFILE=1 SHADOW_MAP_RES=1024 SHADOW_DIST=96.0 SHADOW_SAMPLES=4 SSR_STEPS=0 VL_STEPS=6 NETHER_SMOG_STEPS=4 TAA LIGHT_FIELD VOLUMETRIC_LIGHT !WATER_SSR CLOUDS
profile.POTATO=PERFORMANCE_PROFILE=0 SHADOW_MAP_RES=1024 SHADOW_DIST=80.0 SHADOW_SAMPLES=0 SSR_STEPS=0 VL_STEPS=0 NETHER_SMOG_STEPS=0 !TAA !LIGHT_FIELD !VOLUMETRIC_LIGHT !WATER_SSR CLOUDS
screen.columns=2
screen=<profile> CLOUDS WAVING_FOLIAGE SATURATION <empty> <empty> [QUALITY] [LIGHTING] [SKY] [WATER] [COLOR] [WORLD] [COMFORT] [POTATO]
screen.QUALITY=TAA LIGHT_FIELD SHADOW_MAP_RES SHADOW_DIST SHADOW_SAMPLES SHADOW_SOFTNESS CLOUD_RENDER_DISTANCE VL_STEPS NETHER_SMOG_STEPS SSR_STEPS
screen.LIGHTING=SUN_ILLUMINANCE MOON_ILLUMINANCE BLOCKLIGHT_STRENGTH BLOCKLIGHT_SATURATION FIELD_BRIGHTNESS EMITTER_SATURATION LAVA_EMISSION BLOCK_EMISSION CLOUD_SHADOW_FLOOR VOLUMETRIC_LIGHT [CAVE_LIGHTING] <empty>
