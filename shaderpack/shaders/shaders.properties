# ClaudeBench shaderpack
screen=[SKY] CLOUDS TAA LIGHT_FIELD WAVING_FOLIAGE
screen.SKY=AURORA_MODE AURORA_BRIGHTNESS MILKYWAY_BRIGHTNESS CLOUD_RENDER_DISTANCE
screen.SKY.columns=1
separateAo=true
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=false
moon=true
clouds=off
size.buffer.colortex3=0.5 0.5
size.buffer.colortex7=0.5 0.5
size.buffer.colortex8=0.5 0.5
size.buffer.colortex9=0.5 0.5
size.buffer.colortex11=0.5 0.5
particles.before.deferred=true
dynamicHandLight=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
customTexture.starmap=textures/starmap.dat TEXTURE_2D RGBA16 2048 1024 RGBA UNSIGNED_SHORT
customTexture.milkyway=textures/milkyway.dat TEXTURE_2D RGBA16 2048 1024 RGBA UNSIGNED_SHORT
customTexture.cloudNoise=textures/cloudnoise.dat TEXTURE_3D RGBA16 65 65 65 RGBA UNSIGNED_SHORT
# Distant Horizons LODs lie far outside the ~200 block shadow range; drawing them into the shadow map only costs time.
dhShadow.enabled=false

# The Nether uses composite (vl_march) and composite1 (temporal) for its smog. Clouds and volumetric light are
# identities in the End. Keep the temporal passes enabled there only
# to invalidate their persistent histories; their dimension-specific shader path writes a sentinel without sampling.
program.world-1/deferred.enabled=false
program.world1/deferred.enabled=false

# Voxel light field (lib/voxel.glsl). Sizes must match VOXEL_EXTENT / VOXEL_EXTENT_Y in settings.glsl.
# voxelImg is cleared every frame and rewritten by the shadow pass; the two light volumes ping-pong in shadowcomp.
iris.features.required=CUSTOM_IMAGES COMPUTE_SHADERS BLOCK_EMISSION_ATTRIBUTE
image.voxelImg=voxelSampler red_integer r32ui unsigned_int true false 128 64 128
image.lightFieldA=lightFieldSamplerA rgba rgba16f half_float false false 128 64 128
image.lightFieldB=lightFieldSamplerB rgba rgba16f half_float false false 128 64 128
# Safe-zone culling: every chunk within voxelDistance is drawn in the shadow pass regardless of the light
# direction. Iris's default "advanced" culling keeps only chunks that can shadow the view, which drops the voxels
# behind the camera (and, in the Nether, nearly everything).
shadow.culling=reversed
# Iris only creates the shadow pass (and shadowcomp) when this is explicit or some program samples a shadow
# texture. The Nether and End sample none, so without it their voxel-only shadow pass never ran.
shadow.enabled=true

# Opaque G-buffer programs must not alpha-blend. With Iris's default blending the hand, entities, and cutout terrain
# mixed normal/lightmap and material data with whatever was behind them. In particular, entity pixels could lose
# MAT_ENTITY in colortex2, so deferred/composite cloud guards treated the player as ordinary background geometry.
blend.gbuffers_hand=off
blend.gbuffers_entities=off
blend.gbuffers_entities.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities_translucent=off
blend.gbuffers_entities_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex2=off
blend.gbuffers_terrain=off
blend.gbuffers_block=off
blend.dh_terrain=off
# Water pass: colortex2 takes the portal tag over the material underneath but never changes its alpha (smoothness).
blend.gbuffers_water.colortex2=SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE

# Biome state for the Overworld look (snow whiteout, cave moods). Smoothed so crossing a border fades.
uniform.float.inSnowy=smooth(if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 12, 12)
# Rain where the player is: vanilla draws no rain in biomes without precipitation, so wet ground, puddles, ripples
# and rain fog follow the biome. The sky and clouds keep the global rain level.
uniform.float.rainLocal=rainStrength * smooth(if(biome_precipitation == PPT_NONE, 0.0, 1.0), 15, 15)
uniform.float.wetLocal=wetness * smooth(if(biome_precipitation == PPT_NONE, 0.0, 1.0), 15, 15)
uniform.float.inDeepDark=smooth(if(biome == BIOME_DEEP_DARK, 1.0, 0.0), 6, 6)
uniform.float.inLushCave=smooth(if(biome == BIOME_LUSH_CAVES, 1.0, 0.0), 6, 6)
uniform.float.inDripstone=smooth(if(biome == BIOME_DRIPSTONE_CAVES, 1.0, 0.0), 6, 6)
# Warm, humid land (swamps, forests, plains, jungles) gets fireflies at night.
uniform.float.fireflyBiome=smooth(if(temperature >= 0.5 && temperature <= 1.2 && rainfall >= 0.35, 1.0, 0.0), 10, 10)
